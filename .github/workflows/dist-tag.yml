name: Dist-tag

# Move or remove an npm dist-tag without publishing anything. Run it from the
# Actions tab.
#
# Releases already point `next` at whatever they publish as `latest`, so this
# is for the cases that fall outside a release: promoting an older version,
# parking `next` on a prerelease, or retiring a tag.
#
# OIDC authenticates `npm publish` only, so this one needs the NPM_TOKEN
# secret — a granular token with write access to this package.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to tag, e.g. 1.0.0'
        type: string
        required: true
      tag:
        description: 'The dist-tag to move'
        type: choice
        required: true
        default: next
        options:
          - next
          - latest
      operation:
        description: 'Point the tag at the version, or remove the tag'
        type: choice
        required: true
        default: add
        options:
          - add
          - remove

permissions:
  contents: read

jobs:
  dist-tag:
    name: ${{ inputs.operation }} ${{ inputs.tag }} → ${{ inputs.version }}
    runs-on: ubuntu-latest
    environment: release

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Check the token is present
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::error::NPM_TOKEN is not set. Add a granular npm token with write access to this package as a repository secret."
            exit 1
          fi

      - name: Move the tag
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          name=$(node -p "require('./package.json').name")
          version='${{ inputs.version }}'
          tag='${{ inputs.tag }}'

          # A tag pointing at a version that does not exist is worse than no
          # tag, so check before writing.
          if ! npm view --prefer-online "$name@$version" version >/dev/null 2>&1; then
            echo "::error::$name@$version is not on the registry"
            exit 1
          fi

          if [ '${{ inputs.operation }}' = 'add' ]; then
            npm dist-tag add "$name@$version" "$tag"
          else
            if [ "$tag" = 'latest' ]; then
              echo "::error::latest cannot be removed; point it at a version instead"
              exit 1
            fi
            npm dist-tag rm "$name" "$tag"
          fi

      - name: Report the tags
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          name=$(node -p "require('./package.json').name")
          tags=$(npm dist-tag ls "$name")
          echo "$tags"
          {
            echo "### dist-tags for \`$name\`"
            echo
            echo '```'
            echo "$tags"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
